<title>✨🔮 紫靈牌卡 ✦ 線上占卜 🔮✨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Playfair+Display:ital,wght@0,500;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#fcf8fd; --bg2:#f3edf7; --glow:rgba(215,180,255,.45);
  --text:#423b4a; --muted:#84788f; --line:#e6deee;
  --card:#ffffff; --accent:#9d7fb2; --accent-d:#7e5d95; --btn-text:#fff;
  --shadow:0 10px 30px rgba(130,100,150,.14);
  --t0:#8a6fc0; --t1:#c47a58; --t2:#5a9a82;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; color:var(--text);
  font-family:"Noto Serif TC","PingFang TC","Microsoft JhengHei","Hiragino Mincho ProN",serif;
  background: 
    radial-gradient(circle at 15% 20%, rgba(200, 170, 235, 0.18) 0%, transparent 40%),
    radial-gradient(circle at 85% 80%, rgba(220, 195, 245, 0.15) 0%, transparent 40%),
    linear-gradient(135deg, rgba(157, 127, 178, 0.04) 0%, rgba(126, 93, 149, 0.08) 100%),
    radial-gradient(ellipse 80% 45% at 50% -5%, var(--glow), transparent 70%), 
    linear-gradient(180deg, var(--bg1), var(--bg2));
  background-color: var(--bg1);
  position: relative;
  overflow-x: hidden;
}

/* 背景極細星空幾何裝飾層 */
body::before {
  content: "";
  position: fixed;
  inset: 0;
  background-image: 
    radial-gradient(circle at 50% 30%, transparent 58%, rgba(157, 127, 178, 0.08) 59%, transparent 60%),
    radial-gradient(circle at 50% 30%, transparent 78%, rgba(157, 127, 178, 0.05) 79%, transparent 80%),
    radial-gradient(circle at 20% 15%, rgba(157, 127, 178, 0.3) 1.5px, transparent 2px),
    radial-gradient(circle at 82% 25%, rgba(157, 127, 178, 0.25) 1px, transparent 2px),
    radial-gradient(circle at 15% 75%, rgba(157, 127, 178, 0.25) 1px, transparent 2px),
    radial-gradient(circle at 88% 70%, rgba(157, 127, 178, 0.3) 1.5px, transparent 2px),
    radial-gradient(circle at 50% 85%, rgba(157, 127, 178, 0.2) 1px, transparent 2px);
  background-size: 100% 100%;
  pointer-events: none;
  z-index: 0;
}

main{max-width:900px; margin:0 auto; padding:56px 20px 64px; text-align:center; position:relative; z-index:1;}

/* 副標題設計 */
.sub-title {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  color: var(--accent-d);
  font-size: 16px;
  font-style: italic;
  letter-spacing: 0.25em;
  margin-bottom: 12px;
  font-family: 'Playfair Display', "Noto Serif TC", serif;
}
.sub-title::before, .sub-title::after {
  content: "";
  display: block;
  width: 45px;
  height: 1px;
  background: var(--accent-d);
  opacity: 0.6;
}

/* 主標題：手機版不換行 */
h1{
  font-weight: 700; 
  font-size: clamp(20px, 4.8vw, 40px); 
  letter-spacing: .15em; 
  margin: 0 0 24px; 
  white-space: nowrap;
}

/* 說明文字：指定分段換行 */
.hint{
  color:var(--muted); 
  font-size:15px; 
  line-height:2.0; 
  letter-spacing:.08em; 
  margin:0 auto 30px; 
  max-width:32em;
  white-space: pre-line;
}

.btn-group{display:flex; justify-content:center; gap:14px; flex-wrap:wrap; margin-bottom:10px;}
.btn{
  font-family:inherit; font-size:17px; letter-spacing:.15em; padding:12px 30px; border:none; border-radius:999px; cursor:pointer;
  color:#fff; box-shadow:0 8px 22px rgba(0,0,0,.12); transition:transform .15s;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
/* 一鍵抽卡 (暖橘色) */
.btn-orange{
  background: linear-gradient(135deg, #e09f6b, #c47a58);
  box-shadow: 0 8px 22px rgba(196,122,88,0.3);
}
/* 手動抽卡 (紫靈質感紫色) */
.btn-purple{
  background: linear-gradient(135deg, var(--accent), var(--accent-d));
  box-shadow: 0 8px 22px rgba(126,93,149,0.3);
}

.btn:hover{transform:translateY(-2px)} .btn:active{transform:scale(.98)} .btn:disabled{opacity:.7;cursor:default}

.snd-group{
  position:fixed; right:14px; top:calc(env(safe-area-inset-top,0px) + 12px); z-index:5;
  display:flex; gap:8px;
}
.snd{
  font-family:inherit; font-size:12px; color:var(--muted); background:var(--card); border:1px solid var(--line);
  border-radius:999px; padding:6px 10px; cursor:pointer;
}

.cards{
  display:grid; grid-template-columns:repeat(3,1fr); gap:18px; margin:42px 0 26px; perspective:1000px;
}
.slot{aspect-ratio:3/4.3; position:relative}
.ph{position:absolute; inset:0; border:1.5px dashed var(--line); border-radius:20px; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:14px; letter-spacing:.2em; background: rgba(255,255,255,0.6); backdrop-filter: blur(4px);}
.card{
  position:absolute; inset:0; background:var(--card); border-radius:20px; box-shadow:var(--shadow); border:1px solid var(--line);
  overflow:hidden; display:flex; flex-direction:column; align-items:center; padding:16px 14px 0;
  animation:flip .7s cubic-bezier(.2,.8,.3,1) both;
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--tone) 9%,var(--card)),var(--card) 55%);
}
.t0{--tone:var(--t0)} .t1{--tone:var(--t1)} .t2{--tone:var(--t2)}
.head{width:100%; display:flex; justify-content:space-between; align-items:center; position:relative; z-index:1}
.cat{font-size:13px; letter-spacing:.25em; color:var(--tone); font-weight:600}
.ibox{
  width:34%; max-width:110px; aspect-ratio:1; margin:16px 0 14px; border-radius:24%; color:var(--tone); position:relative; z-index:1;
  background:color-mix(in srgb,var(--tone) 14%,var(--card)); border:1px solid color-mix(in srgb,var(--tone) 28%,transparent);
  display:flex; align-items:center; justify-content:center;
}
.ibox svg{width:64%; height:64%}
.name{font-size:clamp(28px,4.6vw,40px); font-weight:700; letter-spacing:.1em; padding-left:.1em; position:relative; z-index:1}
.kw{font-size:13.5px; letter-spacing:.06em; color:var(--tone); margin-top:8px; font-weight:600; position:relative; z-index:1; line-height:1.6}
.sky{position:absolute; left:0; right:0; bottom:0; width:100%; height:34%; color:var(--tone); opacity:.32; pointer-events:none}
@keyframes flip{from{opacity:0; transform:rotateY(90deg) translateY(10px)} to{opacity:1; transform:none}}

/* 動作按鈕區：雙排設計 */
.actions{min-height:52px; display:flex; flex-direction:column; align-items:center; gap:12px; margin-top:10px;}
.action-row{display:flex; justify-content:center; gap:12px; flex-wrap:wrap; width:100%;}
.action-btn{
  font-family:inherit; font-size:15px; letter-spacing:.15em; padding:10px 22px; background:var(--card); 
  color:var(--accent-d); border:1.5px solid var(--accent); border-radius:999px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; transition:background .15s; box-shadow: 0 4px 12px rgba(130,100,150,0.08);
}
.action-btn:hover{background:rgba(157,127,178,.15)}

.consultant-tip{
  font-size: 13.5px;
  color: var(--accent-d);
  letter-spacing: 0.08em;
  margin: 6px 0 2px;
  opacity: 0.9;
}

.toast{width:100%; height:22px; font-size:14px; color:var(--accent-d); letter-spacing:.1em}
[hidden]{display:none!important}

/* 手動選牌彈跳視窗 */
#manual-modal{
  position:fixed; inset:0; background:rgba(42,35,48,0.75); backdrop-filter:blur(6px);
  z-index:50; display:flex; justify-content:center; align-items:center; padding:20px; overflow-y:auto;
}
.modal-box{
  background:var(--bg1); width:100%; max-width:750px; border-radius:24px; padding:28px 20px;
  box-shadow:0 20px 50px rgba(0,0,0,0.3); border:1px solid var(--line); text-align:left;
  max-height:90vh; overflow-y:auto;
}
.modal-title{font-size:20px; font-weight:700; letter-spacing:.2em; text-align:center; margin-bottom:6px; color:var(--text)}
.modal-subtitle{font-size:13px; color:var(--muted); text-align:center; letter-spacing:.1em; margin-bottom:24px}
.deck-section{margin-bottom:20px}
.deck-label{font-size:14px; font-weight:600; color:var(--text); letter-spacing:.1em; margin-bottom:8px; border-left:3px solid var(--accent); padding-left:8px}
.deck-scroll{
  display:flex; gap:8px; overflow-x:auto; padding:6px 2px 12px; scroll-behavior:smooth;
  scrollbar-width:thin; scrollbar-color: var(--accent) var(--line);
}

.card-back{
  flex:0 0 54px; height:78px; 
  background: linear-gradient(135deg, #201a24, #312838); 
  border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); 
  border-radius:8px;
  cursor:pointer; position:relative; transition:transform .15s, border-color .15s; 
  display:flex; flex-direction:column; align-items:center; justify-content:center; color: #d1bce3;
}
.card-back:hover{transform:translateY(-3px); border-color: var(--accent);}
.card-back.selected{
  border:2px solid var(--accent-d); box-shadow:0 0 12px rgba(126,93,149,0.6); transform:translateY(-4px);
}
.card-back.selected::after{
  content:'✓'; position:absolute; top:-6px; right:-6px; background:var(--accent-d); color:#fff;
  font-size:10px; width:16px; height:16px; border-radius:50%; display:flex; align-items:center; justify-content:center;
}
.modal-actions{display:flex; justify-content:center; gap:14px; margin-top:24px}

footer{
  margin-top: 48px;
  font-size: 11.5px;
  color: var(--muted);
  letter-spacing: 0.15em;
  opacity: 0.7;
}

/* 手機版排版調整 */
@media (max-width:640px){
  main{padding-top:48px; padding-left:14px; padding-right:14px}
  .cards{
    display:grid; grid-template-columns: repeat(2, 1fr); max-width: 380px; margin-left: auto; margin-right: auto; gap: 12px;
  }
  .cards .slot:nth-child(3){
    grid-column: 1 / -1; max-width: 180px; margin: 0 auto; width: 100%;
  }
  .slot{aspect-ratio:3/4.3}
}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
</style>

function rnd(n){try{const a=new Uint32Array(1),l=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a)}while(a[0]>=l);return a[0]%n}catch(e){return Math.floor(Math.random()*n)}}
const pick=a=>a[rnd(a.length)];

function cardHTML(i,cat,s,delay){
  return '<div class="slot"><div class="card t'+i+'" style="animation-delay:'+delay+'s">'+SKY+
    '<div class="head"><span class="cat">'+cat+'</span><span></span></div>'+

}

let ctx=null, mutedSnd=false;
function sound(){
  if(mutedSnd)return;
  try{
    ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==="suspended")ctx.resume();
    const t=ctx.currentTime;
    const n=Math.floor(ctx.sampleRate*.35), b=ctx.createBuffer(1,n,ctx.sampleRate), d=b.getChannelData(0);
    for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*Math.sin(Math.PI*i/n);
    const src=ctx.createBufferSource(); src.buffer=b;
    const filt=ctx.createBiquadFilter(); filt.type="bandpass";
    filt.frequency.setValueAtTime(800, t); filt.frequency.exponentialRampToValueAtTime(2400, t+.35); filt.Q.value=1.2;
    const gainNode=ctx.createGain();
    gainNode.gain.setValueAtTime(0.001, t); gainNode.gain.linearRampToValueAtTime(0.08, t+.05); gainNode.gain.exponentialRampToValueAtTime(0.001, t+.35);
    src.connect(filt).connect(gainNode).connect(ctx.destination); src.start(t);

    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type="sine"; o.frequency.setValueAtTime(1046.5, t+.1);
    g.gain.setValueAtTime(0, t+.1); g.gain.linearRampToValueAtTime(0.04, t+.12); g.gain.exponentialRampToValueAtTime(0.0001, t+.8);
    o.connect(g).connect(ctx.destination); o.start(t+.1); o.stop(t+.85);
  }catch(e){}
}

let bgmCtx=null, bgmInterval=null, mutedBgm=false;
function startBgm(){
  if(mutedBgm) return;
  try{
    bgmCtx = bgmCtx || new (window.AudioContext || window.webkitAudioContext)();
    if(bgmCtx.state==="suspended") bgmCtx.resume();
    
    const melodyNotes = [523.25, 659.25, 783.99, 880.00, 1046.50, 1318.51];
    
    const playArpeggio = () => {
      if(mutedBgm || !bgmCtx) return;
      let t = bgmCtx.currentTime;
      
      for(let i=0; i<4; i++){
        const freq = melodyNotes[Math.floor(Math.random() * melodyNotes.length)];
        const osc = bgmCtx.createOscillator();
        const gain = bgmCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.value = freq;
        
        const noteTime = t + (i * 0.5);
        gain.gain.setValueAtTime(0.000001, noteTime);
        gain.gain.linearRampToValueAtTime(0.010, noteTime + 5.0);
        gain.gain.exponentialRampToValueAtTime(0.0001, noteTime + 6.2);
        
        osc.connect(gain).connect(bgmCtx.destination);
        osc.start(noteTime);
        osc.stop(noteTime + 6.5);
      }
    };

    playArpeggio();
    if(bgmInterval) clearInterval(bgmInterval);
    bgmInterval = setInterval(playArpeggio, 6000);
  }catch(e){}
}

function stopBgm(){
  if(bgmInterval) { clearInterval(bgmInterval); bgmInterval = null; }
  if(bgmCtx && bgmCtx.state === "running") { bgmCtx.suspend(); }
}

window.addEventListener('load', () => {
  if(!mutedBgm) {
    startBgm();
  }
});
window.addEventListener('pointerdown', () => {
  if(!mutedBgm && bgmCtx && bgmCtx.state === "suspended") {
    bgmCtx.resume();
  }
}, { once: true });

let cur=null, drawTime="", busy=false, tt;
const $c=document.getElementById("cards"), $a=document.getElementById("actions"), $t=document.getElementById("toast");
const $welcome = document.getElementById("welcome-section");
const $btnQuick = document.getElementById("draw-quick"), $btnManual = document.getElementById("draw-manual");
const $modal = document.getElementById("manual-modal");
const $deckMain = document.getElementById("deck-main"), $deckAux = document.getElementById("deck-aux"), $deckLife = document.getElementById("deck-life");
const $modalConfirm = document.getElementById("modal-confirm"), $modalCancel = document.getElementById("modal-cancel");

let selectedMain = null, selectedAux = null, selectedLife = null;

function getFormattedTime() {
  const now = new Date();
  const y = now.getFullYear();
  const m = String(now.getMonth() + 1).padStart(2, '0');
  const d = String(now.getDate()).padStart(2, '0');
  const h = String(now.getHours()).padStart(2, '0');
  const min = String(now.getMinutes()).padStart(2, '0');
  return `${y}/${m}/${d} ${h}:${min}`;
}

function showResultView(){
  $welcome.hidden = true;
  $a.hidden = false;
}

function resetDraw(){
  cur = null;
  $welcome.hidden = false;
  $a.hidden = true;
  $c.innerHTML = '<div class="slot"><div class="ph">主星</div></div><div class="slot"><div class="ph">輔星</div></div><div class="slot"><div class="ph">長生</div></div>';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function quickDraw(){
  if(busy)return; busy=true;
  $btnQuick.disabled=true; $btnManual.disabled=true;
  const m=pick(MAIN), a=pick(AUX), l=pick(LIFE); 
  cur={m,a,l};
  drawTime = getFormattedTime();
  sound();
  showResultView();
  $c.innerHTML=cardHTML(0,"主星",m,0)+cardHTML(1,"輔星",a,.18)+cardHTML(2,"長生",l,.36);
  $t.textContent="";
  setTimeout(()=>{busy=false; $btnQuick.disabled=false; $btnManual.disabled=false;},1000);
}

function openManualModal(){
  selectedMain = null; selectedAux = null; selectedLife = null;
  updateModalState();
  buildDeck($deckMain, MAIN, 'main');
  buildDeck($deckAux, AUX, 'aux');
  buildDeck($deckLife, LIFE, 'life');
  $modal.hidden = false;
}

function buildDeck(container, dataArr, type){
  container.innerHTML = '';
  dataArr.forEach((item) => {
    const el = document.createElement('div');
    el.className = 'card-back';
    el.innerHTML = '<svg style="width:26px;height:26px" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2v20M2 12h20M4.93 4.93l14.14 14.14M4.93 19.07L19.07 4.93"/><circle cx="12" cy="12" r="3" fill="currentColor" fill-opacity="0.3"/></svg>';
    el.onclick = () => {
      container.querySelectorAll('.card-back').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
      if(type==='main') selectedMain = item;
      if(type==='aux') selectedAux = item;
      if(type==='life') selectedLife = item;
      updateModalState();
    };
    container.appendChild(el);
  });
}

function updateModalState(){
  document.getElementById('lbl-m').textContent = `主星牌 (14張) - 已選 ${selectedMain ? 1 : 0}/1`;
  document.getElementById('lbl-a').textContent = `輔星牌 (18張) - 已選 ${selectedAux ? 1 : 0}/1`;
  document.getElementById('lbl-l').textContent = `長生牌 (12張) - 已選 ${selectedLife ? 1 : 0}/1`;

  if(selectedMain && selectedAux && selectedLife){
    $modalConfirm.disabled = false;
    $modalConfirm.style.opacity = '1';
  } else {
    $modalConfirm.disabled = true;
    $modalConfirm.style.opacity = '0.5';
  }
}

function confirmManualDraw(){
  if(!selectedMain || !selectedAux || !selectedLife) return;
  cur = { m: selectedMain, a: selectedAux, l: selectedLife };
  drawTime = getFormattedTime();
  $modal.hidden = true;
  sound();
  showResultView();
  $c.innerHTML = cardHTML(0,"主星",cur.m,0) + cardHTML(1,"輔星",cur.a,.18) + cardHTML(2,"長生",cur.l,.36);
  $t.textContent = "";
}

function toast(m){$t.textContent=m;clearTimeout(tt);tt=setTimeout(()=>{$t.textContent=""},2200)}
function fb(text){const ta=document.createElement("textarea");ta.value=text;ta.setAttribute("readonly","");ta.style.cssText="position:fixed;left:-9999px;top:0;opacity:0";document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand("copy")}catch(e){}document.body.removeChild(ta);return ok}
async function copy(){
  if(!cur)return;
  const text="【✨🔮紫靈牌卡 ✦ 線上占卜🔮✨】\n占卜時間："+drawTime+"\n主星："+cur.m[0]+"（"+cur.m[1]+"）\n輔星："+cur.a[0]+"（"+cur.a[1]+"）\n長生："+cur.l[0]+cur.l[2]+"（"+cur.l[1]+"）";
  let ok=false;
  try{if(navigator.clipboard&&navigator.clipboard.writeText){await navigator.clipboard.writeText(text);ok=true}}catch(e){}
  if(!ok)ok=fb(text);
  toast(ok?"已複製結果文字 ✓":"複製失敗，請手動選取文字");
}

async function shareWebsite(){
  if (navigator.share) {
    try {
      await navigator.share({
        title: '✨🔮 紫靈牌卡 ✦ 線上占卜 🔮✨',
        text: '邀請你一起來體驗精準優雅的紫靈牌卡線上占卜：',
        url: window.location.href
      });
      toast("分享成功 ✓");
    } catch (err) {
      if (err.name !== 'AbortError') {
        console.log("Share failed", err);
      }
    }
  } else {
    let ok = false;
    try {
      await navigator.clipboard.writeText(window.location.href);
      ok = true;
    } catch(e) {}
    toast(ok ? "網址已複製到剪貼簿 ✓" : "分享失敗");
  }
}

async function saveImage(){
  if(!cur) return;
  const canvas = document.createElement('canvas');
  const scale = 2;
  canvas.width = 800 * scale;
  canvas.height = 1100 * scale;
  const ctx = canvas.getContext('2d');
  ctx.scale(scale, scale);

  const bgGrad = ctx.createLinearGradient(0, 0, 0, 1100);
  bgGrad.addColorStop(0, '#fcf8fd');
  bgGrad.addColorStop(1, '#f3edf7');
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, 800, 1100);

  ctx.save();
  ctx.strokeStyle = 'rgba(157, 127, 178, 0.08)';
  ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(400, 330, 240, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(400, 330, 320, 0, Math.PI * 2); ctx.stroke();

  ctx.fillStyle = 'rgba(157, 127, 178, 0.3)';
  [[120, 100], [680, 150], [90, 850], [710, 800], [400, 950]].forEach(([px, py]) => {
    ctx.beginPath(); ctx.arc(px, py, 2, 0, Math.PI*2); ctx.fill();
  });
  ctx.restore();

  ctx.strokeStyle = '#e6deee';
  ctx.lineWidth = 2;
  ctx.strokeRect(30, 30, 740, 1040);

  ctx.fillStyle = '#7e5d95';
  ctx.font = 'italic 20px "Playfair Display", serif';
  ctx.textAlign = 'center';
  ctx.fillText('Purpling Cards', 400, 85);

  ctx.fillStyle = '#423b4a';
  ctx.font = 'bold 30px "Noto Serif TC", serif';
  ctx.fillText('✨🔮 紫靈牌卡 ✦ 線上占卜 🔮✨', 400, 130);

  ctx.fillStyle = '#84788f';
  ctx.font = '15px "Noto Serif TC", serif';
  ctx.fillText(`占卜時間：${drawTime}`, 400, 168);

  ctx.strokeStyle = '#e6deee';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(150, 195);
  ctx.lineTo(650, 195);
  ctx.stroke();

  const cardsData = [
    { title: '主星', data: cur.m, tone: '#8a6fc0' },
    { title: '輔星', data: cur.a, tone: '#c47a58' },
    { title: '長生', data: [cur.l[0] + cur.l[2], cur.l[1]], tone: '#5a9a82' }
  ];

  const cardWidth = 220;
  const cardHeight = 320;
  const gapX = 40;
  const row1Y = 225;
  const row2Y = 575;
  const row1StartX = (800 - (cardWidth * 2 + gapX)) / 2;
  const row2StartX = (800 - cardWidth) / 2;

  cardsData.forEach((c, idx) => {
    let cx, cy;
    if (idx < 2) {
      cx = row1StartX + idx * (cardWidth + gapX);
      cy = row1Y;
    } else {
      cx = row2StartX;
      cy = row2Y;
    }

    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.roundRect(cx, cy, cardWidth, cardHeight, 18);
    ctx.fill();

    ctx.strokeStyle = '#e6deee';
    ctx.lineWidth = 1.5;
    ctx.stroke();

    ctx.fillStyle = c.tone;
    ctx.font = 'bold 15px "Noto Serif TC", serif';
    ctx.textAlign = 'left';
    ctx.fillText(c.title, cx + 20, cy + 35);

    ctx.fillStyle = '#423b4a';
    ctx.font = 'bold 38px "Noto Serif TC", serif';
    ctx.textAlign = 'center';
    ctx.fillText(c.data[0], cx + cardWidth / 2, cy + 175);

    ctx.fillStyle = c.tone;
    ctx.font = 'bold 15px "Noto Serif TC", serif';
    ctx.fillText(c.data[1], cx + cardWidth / 2, cy + 240);
  });

  // 移除了占卜師提示文字，只保留祝福語與版權署名
  ctx.fillStyle = '#84788f';
  ctx.font = '14px "Noto Serif TC", serif';
  ctx.textAlign = 'center';
  ctx.fillText('願這組牌卡為你帶來指引與力量 ✦ 祝你有美好的一天', 400, 955);

  ctx.font = '11px "Noto Serif TC", serif';
  ctx.fillText('Made with 💜 by YAN-HAN', 400, 995);

  canvas.toBlob(async (blob) => {
    const file = new File([blob], `紫靈牌卡占卜結果_${drawTime.replace(/[\/\s:]/g, '')}.png`, { type: 'png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try {
        await navigator.share({
          title: '✨🔮紫靈牌卡 ✦ 線上占卜🔮✨',
          text: `【紫靈牌卡占卜結果】\n占卜時間：${drawTime}`,
          files: [file]
        });
        toast("分享成功 ✓");
        return;
      } catch (err) {
        if (err.name !== 'AbortError') {
          console.log("Share canceled or failed", err);
        }
        return;
      }
    }
    const link = document.createElement('a');
    link.download = file.name;
    link.href = URL.createObjectURL(blob);
    link.click();
    toast("圖片已儲存 ✓");
  }, 'image/png');
}
